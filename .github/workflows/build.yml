name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Prepare release files
      run: |
        mkdir release
        mkdir release/Death99TauntMod
        copy bin\Release\net48\Death99TauntMod.dll release\Death99TauntMod\
        copy Info.json release\Death99TauntMod\
      shell: cmd

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: Death99TauntMod
        path: release/Death99TauntMod/

    - name: Create Release Archive
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        cd release
        powershell Compress-Archive -Path Death99TauntMod -DestinationPath Death99TauntMod_${{ github.ref_name }}.zip
      shell: cmd

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: release/Death99TauntMod_${{ github.ref_name }}.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
